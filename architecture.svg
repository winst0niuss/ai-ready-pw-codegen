<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="1600" height="850" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="850" fill="#030712"/>

  <!-- Vertical Column Guides (Subtle) -->
  <line x1="533" y1="80" x2="533" y2="780" stroke="#1f2937" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="1066" y1="80" x2="1066" y2="780" stroke="#1f2937" stroke-width="2" stroke-dasharray="8,8"/>

  <!-- ============================================== -->
  <!-- STAGE 1 — RECORD (Left Column)                 -->
  <!-- ============================================== -->
  <g transform="translate(76, 60)">
    <text x="190" y="40" font-size="32" font-weight="900" fill="#f9fafb" text-anchor="middle">1. RECORD</text>
    <rect x="140" y="55" width="100" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1"/>
    <text x="190" y="71" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700" letter-spacing="2">CLI TOOL</text>

    <!-- Terminal -->
    <g transform="translate(0, 110)" filter="url(#shadow)">
      <rect width="380" height="140" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
      <circle cx="20" cy="20" r="5" fill="#f87171"/>
      <circle cx="36" cy="20" r="5" fill="#fbbf24"/>
      <circle cx="52" cy="20" r="5" fill="#34d399"/>
      <text x="20" y="60" font-family="ui-monospace, monospace" font-size="14" fill="#f9fafb">$ ai-ready-pw-codegen</text>
      <text x="20" y="85" font-family="ui-monospace, monospace" font-size="14" fill="#34d399">  https://your-app.com</text>
      <!-- Cursor moved closer to text -->
      <rect x="192" y="74" width="8" height="16" fill="#34d399" fill-opacity="0.6">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Arrow -->
    <path d="M190,265 L190,305" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Browser -->
    <g transform="translate(0, 350)" filter="url(#shadow)">
      <rect width="380" height="260" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <rect width="380" height="40" rx="12" fill="#111827"/>
      <rect y="30" width="380" height="10" fill="#111827"/>
      <circle cx="20" cy="20" r="5" fill="#f87171"/>
      <circle cx="36" cy="20" r="5" fill="#fbbf24"/>
      <circle cx="52" cy="20" r="5" fill="#34d399"/>
      <rect x="80" y="10" width="220" height="20" rx="10" fill="#1f2937"/>
      <text x="190" y="24" font-size="11" fill="#9ca3af" text-anchor="middle">your-app.com</text>
      
      <rect x="315" y="10" width="55" height="20" rx="10" fill="#ef4444"/>
      <text x="350" y="24" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">REC</text>
      <circle cx="328" cy="20" r="3" fill="#ffffff">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
      </circle>

      <rect x="40" y="80" width="300" height="35" rx="6" fill="#111827" stroke="#374151"/>
      <text x="50" y="102" font-size="12" fill="#4b5563">Email</text>
      <rect x="40" y="130" width="300" height="35" rx="6" fill="#111827" stroke="#374151"/>
      <text x="50" y="152" font-size="12" fill="#4b5563">Password</text>
      <rect x="40" y="185" width="300" height="40" rx="6" fill="#34d399"/>
      <text x="190" y="210" font-size="14" fill="#064e3b" font-weight="bold" text-anchor="middle">Sign in</text>
      <!-- Computer cursor pointing to Sign in -->
      <g transform="translate(205, 205)">
        <path d="M0,0 L0,18 L5,14 L8,21 L11,20 L8,13 L13,13 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      </g>
    </g>
    
    <text x="190" y="650" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Chromium + Playwright Codegen</text>
  </g>

  <!-- ============================================== -->
  <!-- STAGE 2 — CAPTURE (Middle Column)              -->
  <!-- ============================================== -->
  <g transform="translate(600, 60)">
    <text x="215" y="40" font-size="32" font-weight="900" fill="#10b981" text-anchor="middle">2. CAPTURE</text>
    <text x="215" y="65" font-size="14" fill="#6b7280" text-anchor="middle">Hooked into actionAdded events</text>

    <!-- Connectors (Straight and centered) -->
    <g stroke="#10b981" stroke-width="1" stroke-dasharray="4,4">
      <line x1="100" y1="180" x2="215" y2="310" /> <!-- Selectors -->
      <line x1="330" y1="180" x2="215" y2="310" /> <!-- A11y Tree -->
      <line x1="100" y1="440" x2="215" y2="310" /> <!-- Cleaned DOM -->
      <line x1="330" y1="440" x2="215" y2="310" /> <!-- Artifacts -->
    </g>

    <!-- Central Hub -->
    <g transform="translate(100, 270)" filter="url(#shadow)">
      <rect width="230" height="80" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <text x="115" y="35" font-family="ui-monospace, monospace" font-size="14" fill="#d1fae5" font-weight="bold" text-anchor="middle">_enableRecorder</text>
      <text x="115" y="60" font-family="ui-monospace, monospace" font-size="14" fill="#34d399" text-anchor="middle">↳ Capture Queue</text>
    </g>

    <!-- Satellite Cards -->
    <g transform="translate(0, 100)" filter="url(#shadow)">
      <rect width="200" height="80" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="15" y="30" font-size="15" fill="#f9fafb" font-weight="bold">🎯 Selectors</text>
      <text x="15" y="55" font-size="12" fill="#9ca3af">testId, roles, labels</text>
    </g>

    <g transform="translate(230, 100)" filter="url(#shadow)">
      <rect width="200" height="80" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="15" y="30" font-size="15" fill="#f9fafb" font-weight="bold">🌳 A11y Tree</text>
      <text x="15" y="55" font-size="12" fill="#9ca3af">Computed roles</text>
    </g>

    <g transform="translate(0, 440)" filter="url(#shadow)">
      <rect width="200" height="80" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="15" y="30" font-size="15" fill="#f9fafb" font-weight="bold">🧩 Cleaned DOM</text>
      <text x="15" y="55" font-size="12" fill="#9ca3af">Stripped metadata</text>
    </g>

    <g transform="translate(230, 440)" filter="url(#shadow)">
      <rect width="200" height="80" rx="12" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="15" y="30" font-size="15" fill="#f9fafb" font-weight="bold">📸 Artifacts</text>
      <text x="15" y="55" font-size="12" fill="#9ca3af">Screenshots &amp; Logs</text>
    </g>

    <text x="215" y="650" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Non-blocking parallel metadata collection</text>
  </g>

  <!-- ============================================== -->
  <!-- STAGE 3 — DELIVER (Right Column)               -->
  <!-- ============================================== -->
  <g transform="translate(1144, 60)">
    <text x="190" y="40" font-size="32" font-weight="900" fill="#f87171" text-anchor="middle">3. DELIVER</text>
    <rect x="110" y="55" width="160" height="24" rx="12" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1"/>
    <text x="190" y="71" font-size="11" fill="#f87171" text-anchor="middle" font-weight="700" letter-spacing="2">FINAL ARTIFACTS</text>
    
    <!-- Package -->
    <g transform="translate(0, 110)" filter="url(#shadow)">
      <rect width="380" height="220" rx="12" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
      <rect width="380" height="45" rx="12" fill="#7f1d1d" fill-opacity="0.3"/>
      <text x="20" y="30" font-size="16" fill="#fecaca" font-weight="bold">📦 session-archive.zip</text>
      
      <g transform="translate(20, 75)" font-family="ui-monospace, monospace" font-size="13" fill="#f9fafb">
        <text y="0">📄 actions.jsonl</text>
        <text y="25">📄 snapshots.jsonl</text>
        <text y="50">📄 SESSION.md <tspan fill="#6b7280">(context)</tspan></text>
        <text y="75">📄 TEST_GUIDE.md</text>
        <text y="100">📁 screenshots/</text>
      </g>
    </g>

    <!-- Send to AI (Single Arrow) -->
    <g transform="translate(0, 330)">
      <text x="190" y="30" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Send to AI</text>
      <path d="M190,45 L190,80" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    </g>

    <!-- Code Result -->
    <g transform="translate(0, 440)" filter="url(#shadow)">
      <rect width="380" height="150" rx="12" fill="#020617" stroke="#10b981" stroke-width="1"/>
      <text x="20" y="30" font-family="ui-monospace, monospace" font-size="14" fill="#34d399" font-weight="bold">login.spec.ts</text>
      <line x1="0" y1="45" x2="380" y2="45" stroke="#1f2937" stroke-width="1"/>
      <g transform="translate(20, 75)" font-family="ui-monospace, monospace" font-size="11" fill="#9ca3af">
        <text y="0"><tspan fill="#38bdf8">test</tspan>(<tspan fill="#10b981">'login'</tspan>, <tspan fill="#fbbf24">async</tspan> ({ page }) => {</text>
        <text y="20">  <tspan fill="#fbbf24">await</tspan> page.goto(<tspan fill="#10b981">'/'</tspan>);</text>
        <text y="40">  <tspan fill="#fbbf24">await</tspan> page.getByRole(<tspan fill="#10b981">'button'</tspan>).click();</text>
        <text y="60">});</text>
      </g>
    </g>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
    </marker>
  </defs>

</svg>
