<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".25"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748b"/></marker>
  <style>
    .title{font:800 34px Inter,system-ui,sans-serif;fill:#f8fafc}
    .sub{font:500 16px Inter,system-ui,sans-serif;fill:#94a3b8}
    .label{font:800 13px Inter,system-ui,sans-serif;letter-spacing:2px}
    .head{font:750 22px Inter,system-ui,sans-serif;fill:#f8fafc}
    .body{font:500 15px Inter,system-ui,sans-serif;fill:#94a3b8}
    .mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}
  </style>
</defs>

<rect width="1400" height="520" rx="24" fill="url(#bg)"/>

<!-- Header -->
<text x="70" y="68" class="title">AI-Ready PW Codegen</text>
<text x="70" y="98" class="sub">Record once. Give AI the context. Generate reliable Playwright tests.</text>

<!-- Flow arrows -->
<line x1="350" y1="280" x2="415" y2="280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="685" y1="280" x2="750" y2="280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1020" y1="280" x2="1085" y2="280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 1 -->
<g transform="translate(70 160)">
  <text x="0" y="0" class="label" fill="#38bdf8">01 · RECORD</text>
  <g transform="translate(0 28)" filter="url(#shadow)">
    <rect width="280" height="210" rx="18" fill="#0f172a" stroke="#334155"/>
    <rect width="280" height="42" rx="18" fill="#172033"/>
    <circle cx="22" cy="21" r="5" fill="#f87171"/><circle cx="39" cy="21" r="5" fill="#fbbf24"/><circle cx="56" cy="21" r="5" fill="#34d399"/>
    <rect x="78" y="11" width="145" height="20" rx="10" fill="#0b1220"/>
    <text x="150" y="25" text-anchor="middle" font-size="11" fill="#64748b">your-app.com</text>
    <text x="25" y="78" class="head">Your web app</text>
    <text x="25" y="108" class="body">Click · Fill · Navigate</text>
    <rect x="25" y="132" width="230" height="46" rx="9" fill="url(#accent)"/>
    <text x="140" y="161" text-anchor="middle" font-size="16" font-weight="800" fill="white">Playwright Recorder</text>
  </g>
</g>

<!-- 2 -->
<g transform="translate(415 160)">
  <text x="0" y="0" class="label" fill="#34d399">02 · CAPTURE</text>
  <g transform="translate(0 28)" filter="url(#shadow)">
    <rect width="270" height="210" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="58" class="head">Action context</text>
    <text x="25" y="94" class="body">Actions &amp; selectors</text>
    <text x="25" y="122" class="body">Page structure</text>
    <text x="25" y="150" class="body">Screenshots</text>
    <text x="25" y="178" class="body">Logs &amp; network</text>
  </g>
</g>

<!-- 3 -->
<g transform="translate(750 160)">
  <text x="0" y="0" class="label" fill="#a78bfa">03 · ARCHIVE</text>
  <g transform="translate(0 28)" filter="url(#shadow)">
    <rect width="270" height="210" rx="18" fill="#0f172a" stroke="#4c1d95"/>
    <text x="25" y="58" class="head">recording.zip</text>
    <text x="25" y="94" class="mono">actions.jsonl</text>
    <text x="25" y="122" class="mono">snapshots.jsonl</text>
    <text x="25" y="150" class="mono">screenshots/</text>
    <text x="25" y="178" class="mono">SESSION.md</text>
  </g>
</g>

<!-- 4 -->
<g transform="translate(1085 160)">
  <text x="0" y="0" class="label" fill="#f59e0b">04 · GENERATE</text>
  <g transform="translate(0 28)" filter="url(#shadow)">
    <rect width="245" height="210" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="58" class="head">AI</text>
    <text x="25" y="91" class="body">Claude · Cursor</text>
    <text x="25" y="116" class="body">Gemini · any LLM</text>
    <line x1="25" y1="140" x2="220" y2="140" stroke="#334155"/>
    <text x="25" y="171" class="mono">login.spec.ts</text>
    <text x="25" y="194" class="body">Playwright test</text>
  </g>
</g>

<!-- Footer -->
<rect x="70" y="425" width="1260" height="52" rx="14" fill="#0f172a" stroke="#1e293b"/>
<circle cx="96" cy="451" r="6" fill="#34d399"/>
<text x="115" y="456" class="mono">OFFLINE FIRST</text>
<text x="255" y="456" class="body">No AI connection is needed while recording.</text>
<text x="1040" y="456" class="body">Record → Context → AI → Test</text>
</svg>